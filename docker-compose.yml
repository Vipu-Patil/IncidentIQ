# Ollama is intentionally NOT containerized here — running it natively on
# your host gives it direct GPU access, which matters a lot for local model
# speed. Only Postgres+pgvector (needed starting the RAG phase) runs in Docker.
#
# Usage:
#   docker compose up -d
#   docker compose down          # stop
#   docker compose down -v       # stop and wipe the database volume

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentforge_postgres
    environment:
      POSTGRES_USER: agentforge
      POSTGRES_PASSWORD: agentforge
      POSTGRES_DB: agentforge
    ports:
      - "5432:5432"
    volumes:
      - agentforge_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentforge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  agentforge_pg_data:
